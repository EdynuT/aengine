// Editor surface and application host.
//
// Sits at the top of the dependency graph and is the only module allowed to depend on
// both :core and :ui. Its interface is drawn with Aegis, from :ui.

plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation project(':ui')

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"

    // Scene save/load from the editor
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tests only, for what the editor does apart from its window — the undo history.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

application {
    mainClass = 'com.aengine.Main'
}

tasks.named('run') {
    standardInput = System.in
    jvmArgs += [
        '--enable-native-access=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED'
    ]

    // The installation's shell files (§7): src/dist is what the application plugin copies
    // into the installation, so running from here sees what an installed engine would.
    systemProperty 'aengine.home', file('src/dist').absolutePath

    // ./gradlew :editor:run -PtestShell stands the test themes and layouts in test-shell/ — a
    // local sandbox, not in the repository (.gitignore) — in
    // for the user's own, so trying one never touches ~/.local/share/AEngine. They do not ship.
    if (project.hasProperty('testShell')) {
        systemProperty 'aengine.userdata', file('test-shell').absolutePath
        // ...and the arrangement the user makes there is never written over them.
        systemProperty 'aengine.layoutReadOnly', 'true'
    }
    // ./gradlew :editor:run -PthemeFile=<name> picks a theme file by name; the factory theme
    // — the engine's defaults, compiled in — otherwise.
    if (project.hasProperty('themeFile')) {
        systemProperty 'aengine.theme', project.property('themeFile')
    }
    // ./gradlew :editor:run -PthemeWatch turns on the theme author's development option:
    // saving the theme file in use applies it to the running editor. Off otherwise.
    if (project.hasProperty('themeWatch')) {
        systemProperty 'aengine.themeWatch', 'true'
    }
    // ./gradlew :editor:run -PwindowSize=1280x720 opens the window at that size instead of
    // maximized, to see the interface at other resolutions.
    if (project.hasProperty('windowSize')) {
        systemProperty 'aengine.windowSize', project.property('windowSize')
    }
    // ./gradlew :editor:run -PlayoutFile=<name> reads layouts/<name>.json instead of
    // layouts/default.json — with -PtestShell, one of the test layouts, e.g. -PlayoutFile=moved.
    // Not -Playout: every Gradle project already has a "layout" property of its own, which
    // would be read instead, on every run.
    if (project.hasProperty('layoutFile')) {
        systemProperty 'aengine.layout', project.property('layoutFile')
    }
    // ./gradlew :editor:run -Plocale=<tag> shows the editor in that language — pt-BR — instead
    // of the system's, until the settings page chooses it (Phase 4).
    if (project.hasProperty('locale')) {
        systemProperty 'aengine.locale', project.property('locale')
    }
    // ./gradlew :editor:run -PlocaleCheck writes the texts the language shown has left to
    // translate to build/locale-check/<tag>.json, each with its English, ready to copy into
    // src/dist/lang/<tag>.json.
    if (project.hasProperty('localeCheck')) {
        systemProperty 'aengine.localeCheck', layout.buildDirectory.dir('locale-check').get().asFile.absolutePath
    }
}
