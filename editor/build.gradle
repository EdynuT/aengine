// Editor surface and application host.
//
// Sits at the top of the dependency graph and is the only module allowed to depend on
// both :core and :ui. Dear ImGui is confined here as a transitional
// layer: it is installed into the engine through com.aengine.editor.ImGuiUILayer and
// leaves entirely in Phase 5 of docs/UI_FRAMEWORK_ARCHITECTURE.md.

plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation project(':ui')

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"

    // Scene save/load from the editor
    implementation 'com.google.code.gson:gson:2.10.1'

    // Transitional editor interface — removed in Phase 5.
    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"
    runtimeOnly   "io.github.spair:imgui-java-natives-${imguiNatives}:${imguiVersion}"
}

application {
    mainClass = 'com.aengine.Main'
}

tasks.named('run') {
    standardInput = System.in
    jvmArgs += [
        '--enable-native-access=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED'
    ]

    // The installation's shell files (§7): src/dist is what the application plugin copies
    // into the installation, so running from here sees what an installed engine would.
    systemProperty 'aengine.home', file('src/dist').absolutePath

    // ./gradlew :editor:run -PtestShell stands the test themes and layouts in test-shell/ in
    // for the user's own, so trying one never touches ~/.local/share/AEngine. They do not ship.
    if (project.hasProperty('testShell')) {
        systemProperty 'aengine.userdata', file('test-shell').absolutePath
    }
    // ./gradlew :editor:run -PthemeFile=<name> picks a theme by name; "dark" otherwise.
    if (project.hasProperty('themeFile')) {
        systemProperty 'aengine.theme', project.property('themeFile')
    }
    // ./gradlew :editor:run -PlayoutFile=<name> reads layouts/<name>.json instead of
    // layouts/default.json — with -PtestShell, one of the test layouts, e.g. -PlayoutFile=moved.
    // Not -Playout: every Gradle project already has a "layout" property of its own, which
    // would be read instead, on every run.
    if (project.hasProperty('layoutFile')) {
        systemProperty 'aengine.layout', project.property('layoutFile')
    }
}
