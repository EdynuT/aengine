// Root project: shared configuration only. All code lives in the subprojects.
//
//   :core    renderer, ECS, physics, audio, assets, scripting
//   :ui      the in-house UI framework (see docs/UI_FRAMEWORK_ARCHITECTURE.md)
//   :editor  editor surface and application host
//
// The dependency direction is one-way: editor -> ui -> core. It is enforced here by the
// module graph rather than by convention, so a stray import fails the build.

allprojects {
    group   = 'com.aengine'
    version = '0.16.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    // Directories are short (core/, ui/, editor/); published artifacts are not, so the
    // jars and Maven coordinates stay unambiguous outside this repository.
    base {
        archivesName = "aengine-${project.name}"
    }

    ext {
        lwjglVersion = '3.3.4'
        jomlVersion  = '1.10.5'
        imguiVersion = '1.86.11'

        String osName = System.getProperty('os.name').toLowerCase()
        if (osName.contains('win')) {
            lwjglNatives = 'natives-windows'
            imguiNatives = 'windows'
        } else if (osName.contains('mac')) {
            lwjglNatives = 'natives-macos'
            imguiNatives = 'macos'
        } else {
            lwjglNatives = 'natives-linux'
            imguiNatives = 'linux'
        }
    }
}
