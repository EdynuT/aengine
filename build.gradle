// Root project: shared configuration only. All code lives in the subprojects.
//
//   :core    renderer, ECS, physics, audio, assets, scripting
//   :ui      the in-house UI framework (see docs/UI_FRAMEWORK_ARCHITECTURE.md)
//   :editor  editor surface and application host
//
// The dependency direction is one-way: editor -> ui -> core. It is enforced here by the
// module graph rather than by convention, so a stray import fails the build.

