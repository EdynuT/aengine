// Aegis — AEngine's in-house UI framework.
//
// The module stays ':ui' and the directory stays 'ui/': the module says what the code is for,
// the package says what it is. Aegis lives in com.aengine.aegis.
//
// Design and phased plan: docs/UI_FRAMEWORK_ARCHITECTURE.md
//
// This module may depend ONLY on :core, and within it only on the graphics API
// interfaces, Window/Input/Keys and Logger/FileSystem. It must never reach into the ECS,
// the editor, physics or the OpenGL backend package. That restriction is what keeps the
// framework extractable into its own repository later; see §3 of the design document.
//
// The Gradle module graph alone does NOT enforce that: it stops this module importing
// :editor, but every package inside :core is on the compile classpath, so
// `import com.aengine.ecs.Registry` would compile fine. The checkBoundary task below is
// what actually enforces it, and it runs as part of compileJava.
//
// Text starts on stb_truetype, the first stage of the text stack in §6 of the design
// document. FreeType, HarfBuzz and msdfgen (all published for LWJGL 3.3.4) come later, when
// shaping and scale-independent glyphs are needed, not before.

plugins {
    id 'maven-publish'
}

dependencies {
    implementation project(':core')

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"

    // Glyph atlas baking. The natives arrive at runtime through :core, which already
    // depends on them for image decoding.
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"

    // Reading theme.json and layout.json (§7). The same version the rest of the project uses;
    // :core has it too, but as its own implementation detail, not on this module's classpath.
    implementation 'com.google.code.gson:gson:2.10.1'
}

// ---------------------------------------------------------------------------------------
// Architectural boundary check.
//
// Fails the build when this module imports an engine package it is not allowed to see.
// Without this the boundary is documentation, not a rule — see the note above.
// ---------------------------------------------------------------------------------------
def allowedCorePackages = [
    'com.aengine.graphics',   // API interfaces only; graphics.opengl is denied below
    'com.aengine.core',       // Window, Input, Keys, UILayer, RenderMode
    'com.aengine.utils',      // Logger, FileSystem
]
def deniedPackages = [
    'com.aengine.graphics.opengl',  // backend implementation, not the API
]

def checkBoundary = tasks.register('checkBoundary') {
    description = 'Fails if :ui imports an engine package outside its allowed set.'
    group = 'verification'

    def sources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sources)
    outputs.upToDateWhen { false }

    doLast {
        def violations = []
        sources.each { file ->
            file.eachLine { line, number ->
                def matcher = line =~ /^\s*import\s+(?:static\s+)?(com\.aengine\.[\w.]+)/
                if (!matcher) return
                def imported = matcher[0][1]
                if (imported.startsWith('com.aengine.aegis.')) return

                def denied  = deniedPackages.any  { imported == it || imported.startsWith(it + '.') }
                def allowed = allowedCorePackages.any { imported == it || imported.startsWith(it + '.') }

                if (denied || !allowed) {
                    violations << "  ${file.name}:${number}  ${imported}"
                }
            }
        }
        if (violations) {
            throw new GradleException(
                "The :ui module violates its dependency boundary:\n" +
                violations.join('\n') +
                "\n\nThe UI framework may only use the graphics API interfaces, Window/Input/Keys\n" +
                "and Logger/FileSystem. Reaching into the ECS, editor, physics or the OpenGL\n" +
                "backend breaks the boundary that keeps it extractable.\n" +
                "See docs/UI_FRAMEWORK_ARCHITECTURE.md §3.")
        }
    }
}

tasks.named('compileJava') { finalizedBy checkBoundary }
tasks.named('check')       { dependsOn checkBoundary }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'aengine-ui'
            pom {
                name = 'Aegis'
                description = 'Aegis — in-house immediate/retained hybrid UI framework for the AEngine editor'
            }
        }
    }
    repositories { mavenLocal() }
}
